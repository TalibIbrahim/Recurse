<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recurse Extension</title>
  <style>
    :root {
      --bg: #0B0F19;
      --card-bg: #111827;
      --border: #1E293B;
      --border-focus: #38BDF8;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --primary: #0284C7;
      --primary-hover: #0369A1;
      --success: #10B981;
      --danger: #EF4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      -webkit-font-smoothing: antialiased;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-mark {
      width: 10px;
      height: 10px;
      background: #38BDF8;
      border-radius: 50%;
      box-shadow: 0 0 8px #38BDF8;
    }

    .title {
      font-size: 15px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .badge {
      font-size: 10px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
      padding: 2px 6px;
      border-radius: 4px;
      background-color: #1E293B;
      color: #94A3B8;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 12px;
      font-weight: 600;
      color: var(--text-muted);
      margin-bottom: 6px;
    }

    input {
      width: 100%;
      padding: 8px 10px;
      background-color: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 6px;
      color: var(--text);
      font-size: 13px;
      outline: none;
      transition: border-color 0.15s ease;
    }

    input:focus {
      border-color: var(--border-focus);
    }

    .button-group {
      display: flex;
      gap: 8px;
      margin-top: 16px;
    }

    button {
      flex: 1;
      padding: 9px 12px;
      border-radius: 6px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: background-color 0.15s ease;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #FFFFFF;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background-color: #1E293B;
      color: #E2E8F0;
    }

    .btn-secondary:hover {
      background-color: #334155;
    }

    .status {
      margin-top: 12px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      display: none;
      align-items: center;
      gap: 6px;
    }

    .status.success {
      display: flex;
      background-color: rgba(16, 185, 129, 0.1);
      color: #34D399;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    .status.error {
      display: flex;
      background-color: rgba(239, 68, 68, 0.1);
      color: #F87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }

    .footer {
      margin-top: 14px;
      font-size: 11px;
      color: #64748B;
      text-align: center;
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="title">Recurse Sync</div>
    </div>
    <div class="badge">v1.0</div>
  </div>

  <div class="field">
    <label for="serverUrl">Recurse Server URL</label>
    <input type="url" id="serverUrl" placeholder="https://recurse.pages.dev" value="https://recurse.pages.dev" />
  </div>

  <div class="field">
    <label for="apiToken">API Authorization Token</label>
    <input type="password" id="apiToken" placeholder="Enter your token or key" />
  </div>

  <div class="button-group">
    <button type="button" id="btnSave" class="btn-primary">Save Settings</button>
    <button type="button" id="btnTest" class="btn-secondary">Test Connection</button>
  </div>

  <div id="statusBox" class="status"></div>

  <div class="footer">
    Detects accepted LeetCode solves automatically.
  </div>

  <script src="popup.js"></script>
</body>
</html>
