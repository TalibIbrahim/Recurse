<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Recurse Extension</title>
  <style>
    :root {
      --bg: #090D16;
      --card-bg: rgba(255, 255, 255, 0.04);
      --card-border: rgba(255, 255, 255, 0.08);
      --border-focus: #38BDF8;
      --text: #F8FAFC;
      --text-muted: #94A3B8;
      --text-dim: #64748B;
      --primary: #0284C7;
      --primary-hover: #0369A1;
      --success: #10B981;
      --warning: #F59E0B;
      --danger: #EF4444;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      width: 320px;
      font-family: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      padding: 16px;
      -webkit-font-smoothing: antialiased;
      user-select: none;
    }

    .header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
      padding-bottom: 12px;
      border-bottom: 1px solid var(--card-border);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .brand-mark {
      width: 8px;
      height: 8px;
      background: #38BDF8;
      border-radius: 50%;
      box-shadow: 0 0 10px #38BDF8;
    }

    .brand-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: -0.01em;
    }

    .badge {
      font-size: 10px;
      font-weight: 600;
      letter-spacing: 0.04em;
      padding: 2px 7px;
      border-radius: 9999px;
      background: rgba(255, 255, 255, 0.06);
      color: var(--text-muted);
      border: 1px solid var(--card-border);
    }

    /* Connected View */
    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 14px;
    }

    .status-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 11px;
      font-weight: 600;
      text-transform: uppercase;
      letter-spacing: 0.05em;
    }

    .status-dot {
      width: 7px;
      height: 7px;
      border-radius: 50%;
    }

    .status-dot.active {
      background-color: var(--success);
      box-shadow: 0 0 8px rgba(16, 185, 129, 0.6);
    }

    .status-dot.idle {
      background-color: var(--warning);
      box-shadow: 0 0 8px rgba(245, 158, 11, 0.6);
    }

    .user-info {
      display: flex;
      flex-direction: column;
      gap: 2px;
      margin-bottom: 10px;
    }

    .user-name {
      font-size: 14px;
      font-weight: 600;
      color: #FFFFFF;
    }

    .user-handle {
      font-size: 12px;
      color: var(--text-muted);
    }

    .token-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: rgba(0, 0, 0, 0.3);
      padding: 6px 8px;
      border-radius: 6px;
      border: 1px solid rgba(255, 255, 255, 0.05);
      cursor: pointer;
      margin-top: 6px;
    }

    .token-row:hover {
      border-color: rgba(255, 255, 255, 0.15);
    }

    .token-text {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      max-width: 220px;
    }

    .copy-hint {
      font-size: 10px;
      color: #38BDF8;
      font-weight: 600;
    }

    .info-text {
      font-size: 11px;
      color: var(--text-muted);
      line-height: 1.45;
      margin-bottom: 14px;
    }

    .btn {
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      cursor: pointer;
      border: none;
      transition: all 0.15s ease;
      text-decoration: none;
    }

    .btn-primary {
      background-color: var(--primary);
      color: #FFFFFF;
      margin-bottom: 8px;
    }

    .btn-primary:hover {
      background-color: var(--primary-hover);
    }

    .btn-secondary {
      background: rgba(255, 255, 255, 0.06);
      color: var(--text);
      border: 1px solid var(--card-border);
      margin-bottom: 8px;
    }

    .btn-secondary:hover {
      background: rgba(255, 255, 255, 0.1);
    }

    .btn-subtle {
      background: transparent;
      color: var(--text-dim);
      font-size: 11px;
      padding: 6px;
      margin-top: 4px;
    }

    .btn-subtle:hover {
      color: var(--text);
    }

    /* Manual Link Section */
    .manual-section {
      margin-top: 10px;
      padding-top: 10px;
      border-top: 1px solid var(--card-border);
    }

    .manual-toggle {
      font-size: 11px;
      color: var(--text-muted);
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 4px 0;
    }

    .manual-toggle:hover {
      color: var(--text);
    }

    .manual-content {
      margin-top: 8px;
      display: none;
    }

    .manual-content.open {
      display: block;
    }

    input {
      width: 100%;
      padding: 8px 10px;
      background: rgba(0, 0, 0, 0.4);
      border: 1px solid var(--card-border);
      border-radius: 6px;
      color: var(--text);
      font-size: 12px;
      outline: none;
      margin-bottom: 8px;
      transition: border-color 0.15s ease;
    }

    input:focus {
      border-color: var(--border-focus);
    }

    /* Status Alert */
    .status-alert {
      margin-top: 10px;
      padding: 8px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 500;
      display: none;
      align-items: center;
      gap: 6px;
    }

    .status-alert.success {
      display: flex;
      background: rgba(16, 185, 129, 0.12);
      color: #34D399;
      border: 1px solid rgba(16, 185, 129, 0.25);
    }

    /* Update banner & footer */
    .update-banner {
      display: none;
      flex-direction: column;
      gap: 8px;
      margin-bottom: 14px;
      padding: 10px 12px;
      border-radius: 10px;
      background: rgba(56, 189, 248, 0.1);
      border: 1px solid rgba(56, 189, 248, 0.3);
      font-size: 11px;
      line-height: 1.45;
      color: #BAE6FD;
    }

    .update-banner.visible {
      display: flex;
    }

    .update-banner strong {
      color: #FFFFFF;
    }

    .update-banner code {
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 10px;
      padding: 1px 4px;
      border-radius: 4px;
      background: rgba(0, 0, 0, 0.35);
    }

    .update-banner .btn {
      margin-bottom: 0;
    }

    .footer {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      margin-top: 12px;
      padding-top: 10px;
      border-top: 1px solid var(--card-border);
    }

    .footer-btn {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      background: transparent;
      border: none;
      padding: 4px 2px;
      font-size: 11px;
      font-weight: 500;
      color: var(--text-dim);
      cursor: pointer;
      font-family: inherit;
    }

    .footer-btn:hover:not(:disabled) {
      color: var(--text);
    }

    .footer-btn:disabled {
      cursor: default;
      opacity: 0.6;
    }

    .status-alert.error {
      display: flex;
      background: rgba(239, 68, 68, 0.12);
      color: #F87171;
      border: 1px solid rgba(239, 68, 68, 0.25);
    }
  </style>
</head>
<body>
  <div class="header">
    <div class="brand">
      <div class="brand-mark"></div>
      <div class="brand-title">Recurse</div>
    </div>
    <div class="badge" id="versionBadge">Extension</div>
  </div>

  <div class="update-banner" id="updateBanner" role="status">
    <span id="updateText"></span>
    <button type="button" id="btnReloadNow" class="btn btn-primary">Reload Extension</button>
  </div>

  <!-- View A: Connected -->
  <div id="viewConnected" style="display: none;">
    <div class="card">
      <div class="status-row">
        <div class="status-indicator">
          <div class="status-dot active"></div>
          <span style="color: var(--success);">Connected</span>
        </div>
      </div>
      <div class="user-info">
        <div class="user-name" id="connectedName">Account User</div>
        <div class="user-handle" id="connectedHandle">@user</div>
      </div>
      <div class="token-row" id="tokenRow" title="Click to copy Account ID">
        <span class="token-text" id="connectedUserId">...</span>
        <span class="copy-hint" id="copyHint">Copy</span>
      </div>
    </div>

    <div class="info-text">
      Submissions marked <strong>Accepted</strong> on LeetCode will automatically log to your streak and daily goals.
    </div>

    <button type="button" id="btnDashboard" class="btn btn-primary">Open Recurse Dashboard</button>
    <button type="button" id="btnLeetCode" class="btn btn-secondary">Open LeetCode Problems</button>
    <button type="button" id="btnDisconnect" class="btn btn-subtle">Disconnect Account</button>
  </div>

  <!-- View B: Not Connected -->
  <div id="viewDisconnected" style="display: none;">
    <div class="card">
      <div class="status-row">
        <div class="status-indicator">
          <div class="status-dot idle"></div>
          <span style="color: var(--warning);">Not Connected</span>
        </div>
      </div>
      <div class="info-text" style="margin-bottom: 0;">
        Sign in to your Recurse account to enable automatic solve sync and streak tracking.
      </div>
    </div>

    <button type="button" id="btnLogin" class="btn btn-primary">Log In to Recurse</button>

    <div class="manual-section">
      <div class="manual-toggle" id="manualToggle">
        <span>Connect manually with User ID</span>
        <span id="manualChevron">▾</span>
      </div>
      <div class="manual-content" id="manualContent">
        <input type="text" id="manualTokenInput" placeholder="Paste your User ID / Sync Token" />
        <button type="button" id="btnManualConnect" class="btn btn-secondary">Connect Account</button>
      </div>
    </div>
  </div>

  <div id="statusAlert" class="status-alert"></div>

  <div class="footer">
    <button type="button" id="btnCheckUpdate" class="footer-btn" title="Compare with the latest version published on Recurse">
      Check for updates
    </button>
    <button type="button" id="btnReload" class="footer-btn" title="Reload the extension from its folder to apply updated files">
      &#x21bb; Reload extension
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
